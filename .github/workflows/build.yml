name: 应用程序打包 - Pyinstaller

permissions:
  contents: write

on:
  push:
    branches:
      - '**'        # 匹配所有分支

jobs:
  Build-Windows:
    runs-on: windows-latest

    env:
      PYTHON_VERSION: '3.9'
      OUTPUT_DIR: 'output'
      ARTIFACT_NAME: 'Fluent-QQ-Windows.zip'

    steps:
    - name: 检出最新版本
      uses: actions/checkout@v2

    - name: 验证资源文件路径
      run: |
        Get-ChildItem -Path .
        if (-not (Test-Path "config.json")) { Write-Host "config.json not found"; exit 1 }
        if (-not (Test-Path "app")) { Write-Host "app directory not found"; exit 1 }
        if (-not (Test-Path "qq.png")) { Write-Host "qq.png not found"; exit 1 }
      shell: pwsh

    - name: 设置 Python
      uses: actions/setup-python@v2
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 安装程序依赖和打包依赖
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: 使用 PyInstaller 打包
      run: |
        pyinstaller --onefile --noconsole --name=Fluent-QQ --noupx `
          --add-data "app;app" `
          --add-data "config.json;." `
          --add-data "qq.png;." `
          --hidden-import=PyQt6 `
          --hidden-import=qfluentwidgets `
          --paths=. `
          Fluent-QQ.py
      shell: pwsh

    - name: 创建包含其他文件夹的目录
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        cp dist/Fluent-QQ.exe ${{ env.OUTPUT_DIR }}/
        cp -r config.json ${{ env.OUTPUT_DIR }}/
        cp -r qq.png ${{ env.OUTPUT_DIR }}/
        # cp -r LICENSE ${{ env.OUTPUT_DIR }}/

    - name: 清理旧压缩包
      run: |
        if (Test-Path "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}") {
          Remove-Item "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}"
        }
      shell: pwsh

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: Fluent-QQ-Windows
        path: "${{ env.OUTPUT_DIR }}/"

  Code-Package:
    runs-on: windows-latest

    steps:
    - name: 检出最新版本
      uses: actions/checkout@v2

    - name: 创建输出目录并清理
      run: |
        New-Item -ItemType Directory -Force -Path "output"
        Remove-Item -Path "output/*" -Recurse -ErrorAction Ignore
      shell: pwsh

    - name: 复制所有文件（排除 .git 和 output）
      run: |
        Copy-Item -Path "*" -Destination "output" -Recurse -Exclude @(".git", "output", "__pycache__", ".vscode")
      shell: pwsh

    - name: 创建压缩包
      run: |
        Compress-Archive -Path "output/*" -DestinationPath "output/Code-Package.zip" -Force
      shell: pwsh

    - name: 上传压缩包
      uses: actions/upload-artifact@v4
      with:
        name: Code-Package
        path: "output/Code-Package.zip"

  Build-macOS:
    runs-on: macos-latest
    env:
      PYTHON_VERSION: '3.9'
      OUTPUT_DIR: 'output'
      ARTIFACT_NAME: 'Fluent-QQ-macOS.zip'
    steps:
    - name: 检出最新版本
      uses: actions/checkout@v2
    - name: 验证资源文件路径
      run: |
        ls -alh .
        [ -f "config.json" ] || (echo "config.json not found" && exit 1)
        [ -d "app" ] || (echo "app directory not found" && exit 1)
        [ -f "qq.png" ] || (echo "qq.png not found" && exit 1)
      shell: bash
    - name: 设置 Python
      uses: actions/setup-python@v2
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
      shell: bash
    - name: 使用 PyInstaller 打包
      run: |
        pyinstaller --onefile --windowed --name=Fluent-QQ \
          --add-data "app:app" \
          --add-data "config.json:." \
          --add-data "qq.png:." \
          --hidden-import=PyQt6 \
          --hidden-import=qfluentwidgets \
          --paths=. \
          Fluent-QQ.py
      shell: bash

    - name: 创建包含其他文件夹的目录
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        cp dist/Fluent-QQ ${{ env.OUTPUT_DIR }}/
        cp config.json ${{ env.OUTPUT_DIR }}/
        cp qq.png ${{ env.OUTPUT_DIR }}/
      shell: bash
    - name: 清理旧压缩包
      run: |
        [ -f "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}" ] && rm "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}" || true
      shell: bash
    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: Fluent-QQ-macOS
        path: "${{ env.OUTPUT_DIR }}/"

  Build-Linux:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.9'
      OUTPUT_DIR: 'output'
      ARTIFACT_NAME: 'Fluent-QQ-Linux.zip'
    steps:
    - name: 检出最新版本
      uses: actions/checkout@v2
    - name: 验证资源文件路径
      run: |
        ls -alh .
        [ -f "config.json" ] || (echo "config.json not found" && exit 1)
        [ -d "app" ] || (echo "app directory not found" && exit 1)
        [ -f "qq.png" ] || (echo "qq.png not found" && exit 1)
      shell: bash
    - name: 设置 Python
      uses: actions/setup-python@v2
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
      shell: bash
    - name: 使用 PyInstaller 打包
      run: |
        pyinstaller --onefile --windowed --name=Fluent-QQ \
          --add-data "app:app" \
          --add-data "config.json:." \
          --add-data "qq.png:." \
          --hidden-import=PyQt6 \
          --hidden-import=qfluentwidgets \
          --paths=. \
          Fluent-QQ.py
      shell: bash
    - name: 创建包含其他文件夹的目录
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        cp dist/Fluent-QQ ${{ env.OUTPUT_DIR }}/
        cp config.json ${{ env.OUTPUT_DIR }}/
        cp qq.png ${{ env.OUTPUT_DIR }}/
      shell: bash
    - name: 清理旧压缩包
      run: |
        [ -f "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}" ] && rm "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}" || true
      shell: bash
    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: Fluent-QQ-Linux
        path: "${{ env.OUTPUT_DIR }}/"

  Collect-Artifacts:
    needs: [Build-Windows, Build-macOS, Build-Linux]
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@v4
        with:
          name: Fluent-QQ-Windows
          path: output/all/windows
      - name: 下载 macOS 构建产物
        uses: actions/download-artifact@v4
        with:
          name: Fluent-QQ-macOS
          path: output/all/macos
      - name: 下载 Linux 构建产物
        uses: actions/download-artifact@v4
        with:
          name: Fluent-QQ-Linux
          path: output/all/linux
      - name: 展示收集到的产物
        run: |
          ls -alR output/all
      - name: 上传所有平台产物
        uses: actions/upload-artifact@v4
        with:
          name: Fluent-QQ-All
          path: output/all/
